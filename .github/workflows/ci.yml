name: Dilim Windows CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fonts and engines
        shell: pwsh
        run: |
          ./build/fetch-fonts.ps1
          ./build/fetch-engines.ps1 -Only ffmpeg,7zip
      - run: dotnet test tests/Filee.Core.Tests --logger trx
      - run: dotnet test tests/Filee.Setup.Tests --logger trx
      - run: dotnet test tests/Filee.App.Tests --filter "FullyQualifiedName~CatalogTests|FullyQualifiedName~ConversionSettingsTests|FullyQualifiedName~LocalizationTests|FullyQualifiedName~SingleInstanceTests|FullyQualifiedName~UpdateServiceTests|FullyQualifiedName~DilimPieTests|FullyQualifiedName~EnginesPageTests|FullyQualifiedName~EngineUpdateTests" --logger trx
      - run: dotnet test tests/Filee.Engines.Tests --filter "FullyQualifiedName~FileConverterParityTests|FullyQualifiedName~VideoTuningTests|FullyQualifiedName~PdfCompressionTests|FullyQualifiedName~DilimToolTests|FullyQualifiedName~EngineInstallerTests|FullyQualifiedName~PortableEngineTests|FullyQualifiedName~AppLocalRuntimeTests" --logger trx
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests
          path: '**/TestResults/*.trx'
