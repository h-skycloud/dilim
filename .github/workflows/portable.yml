name: Portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          ./build/fetch-fonts.ps1
          ./build/build-dilim-release.ps1 -RepositoryUrl "https://github.com/${{ github.repository }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dilim-packages
          path: Releases/*
