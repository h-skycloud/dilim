name: Draft Dilim release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build clean public packages
        shell: pwsh
        run: |
          ./build/fetch-fonts.ps1
          ./build/build-dilim-release.ps1 -RepositoryUrl "https://github.com/${{ github.repository }}"
          ./build/check-dilim-installer.ps1
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseProps = [xml](Get-Content Directory.Build.props)
          $releaseVersion = [string]$releaseProps.Project.PropertyGroup.Version
          gh release create "v$releaseVersion" ./Releases/* --draft --title "Dilim $releaseVersion" --notes "Dilim contributors · https://github.com/h-skycloud/dilim · See README and included notices."
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed.' }
