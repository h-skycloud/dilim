name: Dilim release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish right away (installed copies see the update only once it is published, not as a draft)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build clean public packages
        shell: pwsh
        run: |
          ./build/fetch-fonts.ps1
          ./build/build-dilim-release.ps1 -RepositoryUrl "https://github.com/${{ github.repository }}"
          ./build/check-dilim-installer.ps1
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $releaseVersion = [string]([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::IndexOf($lines, "## $releaseVersion")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $releaseVersion' section. The update card reads its <!-- update --> block." }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          if ($notes -notmatch '<!-- update') { throw "The $releaseVersion section has no <!-- update --> block (level and one-line summaries)." }
          Set-Content -LiteralPath release-notes.md -Value $notes.Trim() -Encoding utf8
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
      - name: winget manifests
        shell: pwsh
        run: |
          # The three manifests winget-pkgs takes for this version (submit them with wingetcreate or a pull request
          # to microsoft/winget-pkgs; see docs/DILIM-RELEASE.md). The installer is the version's own Setup.
          $v = $env:RELEASE_VERSION
          $setup = "Releases/Dilim-$v-win-Setup.exe"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/Dilim-$v-win-Setup.exe"
          $dir = "winget/manifests/d/Dilim/Dilim/$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          PackageIdentifier: Dilim.Dilim
          PackageVersion: $v
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/Dilim.Dilim.yaml" -Encoding utf8
          @"
          PackageIdentifier: Dilim.Dilim
          PackageVersion: $v
          InstallerType: inno
          Scope: machine
          InstallModes: [interactive, silent, silentWithProgress]
          UpgradeBehavior: install
          Installers:
          - Architecture: x64
            InstallerUrl: $url
            InstallerSha256: $sha
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/Dilim.Dilim.installer.yaml" -Encoding utf8
          @"
          PackageIdentifier: Dilim.Dilim
          PackageVersion: $v
          PackageLocale: en-US
          Publisher: Dilim
          PackageName: Dilim
          License: MIT
          LicenseUrl: https://github.com/${{ github.repository }}/blob/main/LICENSE
          PackageUrl: https://github.com/${{ github.repository }}
          ShortDescription: Convert files and run file tools from a pie menu on the desktop.
          ReleaseNotesUrl: https://github.com/${{ github.repository }}/releases/tag/v$v
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/Dilim.Dilim.locale.en-US.yaml" -Encoding utf8
          Compress-Archive -Path winget/manifests -DestinationPath "Releases/Dilim-$v-winget-manifests.zip" -Force
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = @(if ('${{ inputs.publish }}' -eq 'true') { '--latest' } else { '--draft' })
          gh release create "v$env:RELEASE_VERSION" ./Releases/* @draft --title "Dilim $env:RELEASE_VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed.' }
